[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recover-or-infer"
version = "0.1.0"
description = "Zero-shot document structure (recovered ToC or inferred sections) for retrieval over long documents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vadym Soroka" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "tiktoken>=0.7",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "pypdf>=4.0",
]

[tool.setuptools]
packages = ["recover_or_infer"]
